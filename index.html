<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1a3fbf">
<title>Oferta Fácil — Adaptativo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--vm:#D00000;--vm2:#8B0000;--am:#FFD700;--azul:#1E3FBF;--bg:#e8eaf0;--borda:#dde0e8;--txt:#1a1a1a;--cinza:#6b7280;--safe-b:env(safe-area-inset-bottom,0px)}
html,body{overscroll-behavior:none}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--txt);height:100vh;height:100dvh;overflow:hidden}

header{background:linear-gradient(135deg,#1a3fbf,#0f2a8a);color:#fff;height:52px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 3px 14px rgba(15,42,138,.45)}
header h1{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:1.5px;display:flex;align-items:center;gap:6px}
header h1 em{background:var(--am);color:#0f2a8a;padding:2px 6px;border-radius:4px;font-style:normal;font-size:10px;font-family:"Barlow Condensed",sans-serif;font-weight:900;letter-spacing:1px}

.btn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;touch-action:manipulation}
.btn-vm{background:var(--vm);color:#fff}
.btn-azul{background:#1a3fbf;color:#fff}
.btn-print{background:#16a34a;color:#fff}
.btn-outline{background:#fff;color:#1a3fbf;border:2px solid #1a3fbf}
.btn-sm{padding:7px 11px;font-size:12px}
.btn-block{width:100%;justify-content:center;padding:12px}
.btn-ico{width:38px;height:38px;padding:0;justify-content:center;font-size:16px}

.app{display:grid;grid-template-columns:380px 1fr;height:calc(100dvh - 52px)}
.painel{overflow-y:auto;background:#fff;border-right:1px solid var(--borda);-webkit-overflow-scrolling:touch}
.secao{border-bottom:1px solid var(--borda);padding:13px 15px}
.s-titulo{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{background:#1a3fbf;color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:8px;font-family:"Barlow Condensed",sans-serif}
.campo{margin-bottom:8px}
.campo label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--cinza);display:block;margin-bottom:3px}
.campo input,.campo select{width:100%;padding:11px 12px;border:2px solid var(--borda);border-radius:8px;font-family:"Barlow",sans-serif;font-size:15px;background:#fafafa;color:var(--txt)}
.campo input:focus,.campo select:focus{outline:none;border-color:#1a3fbf;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.fmt-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fmt-btn{cursor:pointer;border:2.5px solid var(--borda);border-radius:8px;padding:6px 4px;text-align:center;background:#fff;font-family:"Barlow Condensed",sans-serif}
.fmt-btn.sel{border-color:#FFD700;background:#fffbea}
.fmt-icon{width:100%;aspect-ratio:210/297;background:#1a3fbf;border-radius:3px;display:grid;gap:2px;padding:3px;margin-bottom:4px}
.fmt-icon>div{background:#fff;border-radius:1px}
.fmt-lbl{font-weight:800;font-size:11px}
.fmt-sub{font-size:9px;color:#888;font-weight:600}

.upload-box{border:2px dashed var(--borda);border-radius:8px;padding:14px;text-align:center;cursor:pointer;background:#fafafa}
.upload-box input{display:none}
.upload-box span{font-family:"Barlow Condensed",sans-serif;font-size:12px;color:#555;font-weight:700}

.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-height:220px;overflow-y:auto;background:#f7f8fc;border-radius:8px;padding:7px;border:1px solid var(--borda)}
.gal-item{position:relative;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;background:#fff;aspect-ratio:1}
.gal-item.sel{border-color:var(--am)}
.gal-item img{width:100%;height:100%;object-fit:contain;padding:4px}
.gal-nome{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;font-size:8px;font-weight:700;padding:2px 4px;text-align:center;font-family:"Barlow Condensed",sans-serif}
.gal-del{position:absolute;top:2px;right:2px;background:var(--vm);color:#fff;border:none;width:22px;height:22px;border-radius:50%;font-size:11px;cursor:pointer;font-weight:900}

.of-lista{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto}
.of-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--borda);border-radius:8px;cursor:pointer;background:#fafafa}
.of-card.assigned{border-color:#16a34a;background:#ecfdf5}
.of-card img{width:40px;height:40px;object-fit:contain;border:1px solid var(--borda);border-radius:4px;background:#fff}
.of-info{flex:1;min-width:0}
.of-nome{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of-preco{font-size:12px;color:var(--vm);font-weight:700}
.of-slot{font-size:10px;background:#16a34a;color:#fff;padding:3px 6px;border-radius:4px;font-weight:900}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.modal h3{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between}
.modal-close{background:none;border:none;font-size:22px;color:#999;cursor:pointer}

.preview{background:#c8cad4;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px;overflow-y:auto}
.p-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.p-hint{font-size:10px;color:#666;font-family:"Barlow Condensed",sans-serif}
.a4{width:min(480px,100%);aspect-ratio:210/297;background:#fff;box-shadow:0 8px 36px rgba(0,0,0,.38);position:relative;overflow:hidden;display:grid}
.a4.g1{grid-template:1fr/1fr}
.a4.g2{grid-template:1fr 1fr/1fr}
.a4.g4{grid-template:1fr 1fr/1fr 1fr}
.a4.g6{grid-template:1fr 1fr 1fr/1fr 1fr}

.cel{position:relative;background:#fff;border:1px dashed rgba(0,0,0,.15);overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.cel.empty::after{content:'+ Toque p/ atribuir';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;padding:6px;text-align:center}
.cel.sel{box-shadow:inset 0 0 0 3px #FFD700}
.cel-img{flex:1;display:flex;align-items:center;justify-content:center;padding:6%;min-height:0}
.cel-img img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.cel-faixa{background:var(--vm);color:#fff;padding:4% 5%;display:flex;align-items:center;justify-content:space-between;gap:4%;min-height:28%}
.cel-nome{font-family:"Bebas Neue",sans-serif;line-height:1;flex:1;word-break:break-word;overflow:hidden}
.cel-preco{font-family:"Bebas Neue",sans-serif;display:flex;align-items:baseline;line-height:1;white-space:nowrap}

.a4.g1 .enc-logo-box{position:absolute;top:3.5%;right:3%;width:28%;height:14%;display:flex;align-items:center;justify-content:center;z-index:10}
.a4.g1 .enc-logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.a4.g1 .enc-logo-box span{font-family:"Bebas Neue",sans-serif;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);letter-spacing:1px}
.a4.g1 .enc-prod-box{position:absolute;top:30%;left:4%;right:4%;height:39%;display:flex;align-items:center;justify-content:center;z-index:10}
.a4.g1 .enc-prod-box img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.a4.g1 .enc-faixa{position:absolute;bottom:0;left:0;right:0;height:27%;display:flex;align-items:center;padding:0 4% 0 5%;z-index:10}
.a4.g1 .enc-fn{flex:0 0 44%;padding-right:3%}
.a4.g1 .enc-fn-nome{font-family:"Bebas Neue",sans-serif;line-height:1.02;letter-spacing:.5px}
.a4.g1 .enc-fp{flex:1;display:flex;align-items:baseline;justify-content:flex-end}
.a4.g1 .enc-rs,.a4.g1 .enc-val,.a4.g1 .enc-cent{font-family:"Bebas Neue",sans-serif}
.a4.g1 .enc-rs{align-self:flex-start;margin-top:3px}
.a4.g1 .enc-val{line-height:.88}
.a4.g1 .enc-dir{display:flex;flex-direction:column;margin-left:2px}
.a4.g1 .enc-un{font-family:"Bebas Neue",sans-serif;background:rgba(0,0,0,.22);padding:1px 5px;border-radius:3px;margin-top:2px}

.mob-toolbar{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borda);z-index:150;box-shadow:0 -4px 14px rgba(0,0,0,.08);padding-bottom:var(--safe-b);grid-template-columns:repeat(5,1fr);height:calc(60px + var(--safe-b))}
.mob-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;font-family:"Barlow Condensed",sans-serif;font-size:10px;font-weight:800;color:#666;cursor:pointer}
.mob-tab span{font-size:20px}
.mob-tab.sel{color:var(--azul)}

/* ═══ ADAPTAÇÃO MOBILE ═══ */
@media (max-width:840px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr;height:calc(100dvh - 52px - 60px - var(--safe-b))}
  .painel{position:fixed;top:52px;bottom:calc(60px + var(--safe-b));left:0;right:0;z-index:140;transform:translateX(-100%);transition:transform .28s ease;border-right:none}
  .painel.open{transform:translateX(0)}
  .preview{padding:10px}
  .a4{width:min(100%,calc((100dvh - 180px) * 210/297))}
  .mob-toolbar{display:grid}
  .fmt-list{grid-template-columns:repeat(2,1fr)}
  .galeria{grid-template-columns:repeat(4,1fr);max-height:none}
  .of-lista{max-height:none}
  header h1{font-size:17px}
  header h1 em{display:none}
  .secao{display:none}
  .secao.active{display:block}
}
@media (min-width:841px){
  .mob-toolbar{display:none!important}
  .secao{display:block!important}
  .painel{transform:none!important}
}

@media print{
  @page{size:210mm 297mm;margin:0}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body>*:not(.print-only){display:none!important}
  .print-only{display:block!important;position:fixed;inset:0}
  .a4-print{width:210mm!important;height:297mm!important;position:fixed;top:0;left:0;overflow:hidden;display:grid!important}
  .a4-print.g1{grid-template:1fr/1fr}
  .a4-print.g2{grid-template:1fr 1fr/1fr}
  .a4-print.g4{grid-template:1fr 1fr/1fr 1fr}
  .a4-print.g6{grid-template:1fr 1fr 1fr/1fr 1fr}
  .a4-print .cel{border:1px dashed #999!important}
}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
</style>
</head>
<body>

<header>
  <h1>🛒 OFERTA FÁCIL <em>A4</em></h1>
  <button class="btn btn-print btn-sm" onclick="imprimir()">🖨️ Imprimir</button>
</header>

<div class="app">
  <div class="painel" id="painel">

    <div class="secao active" data-sec="formato">
      <div class="s-titulo">📐 Formato</div>
      <div class="fmt-list" id="fmt-list"></div>
      <p id="fmt-desc" style="font-size:10px;color:var(--cinza);margin-top:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700"></p>
    </div>

    <div class="secao" data-sec="design">
      <div class="s-titulo">🎨 Design</div>
      <div class="row2">
        <div class="campo"><label>Cor faixa</label><input type="color" id="cor-faixa" value="#D00000"></div>
        <div class="campo"><label>Cor texto</label><input type="color" id="cor-txt" value="#ffffff"></div>
      </div>
      <div id="sec-logo">
        <label class="upload-box" for="logo-file">
          <input type="file" id="logo-file" accept="image/*" onchange="uploadLogo(event)">
          <span>📁 Enviar logo (formato 1)</span>
        </label>
        <div class="campo" style="margin-top:8px"><label>Ou texto</label>
          <input type="text" id="logo-txt" value="SUA LOGO" maxlength="20"></div>
      </div>
    </div>

    <div class="secao" data-sec="galeria">
      <div class="s-titulo">🖼️ Galeria <span class="badge" id="gal-count">0</span></div>
      <button class="btn btn-azul btn-block btn-sm" onclick="abrirModal()" style="margin-bottom:8px">+ Adicionar Produto</button>
      <div class="galeria" id="galeria"></div>
    </div>

    <div class="secao" data-sec="oferta">
      <div class="s-titulo">✏️ Oferta
        <span id="edit-badge" style="display:none;background:#f59e0b;color:#fff;font-size:9px;font-weight:900;padding:2px 7px;border-radius:8px;font-family:'Barlow Condensed',sans-serif">EDITANDO</span>
      </div>
      <div class="campo"><label>Nome</label><input type="text" id="f-nome" value="COSTELA DE GADO" maxlength="40"></div>
      <div class="row2">
        <div class="campo"><label>Preço R$</label><input type="number" id="f-preco" value="22.99" step="0.01" min="0" inputmode="decimal"></div>
        <div class="campo"><label>Unidade</label>
          <select id="f-un"><option>CADA</option><option>KG</option><option>UND</option><option>PCT</option><option>DZ</option><option>L</option><option>100G</option></select>
        </div>
      </div>
      <button class="btn btn-vm btn-block" onclick="salvarOferta()">💾 Salvar</button>
    </div>

    <div class="secao" data-sec="lista">
      <div class="s-titulo">📋 Ofertas <span class="badge" id="of-count">0</span></div>
      <p style="font-size:10px;color:var(--cinza);margin-bottom:6px">Toque numa célula → depois numa oferta</p>
      <div class="of-lista" id="of-lista"></div>
    </div>
  </div>

  <div class="preview">
    <div class="p-tools">
      <button class="btn btn-print btn-sm" onclick="imprimir()">🖨️ Imprimir A4</button>
      <span class="p-hint">210×297mm • <span id="info-fmt">1 produto</span></span>
    </div>
    <div class="a4 g1" id="a4"></div>
  </div>
</div>

<!-- TOOLBAR mobile -->
<nav class="mob-toolbar" id="mob-toolbar">
  <button class="mob-tab sel" data-tab="formato" onclick="abrirAba('formato')"><span>📐</span>Formato</button>
  <button class="mob-tab" data-tab="galeria" onclick="abrirAba('galeria')"><span>🖼️</span>Galeria</button>
  <button class="mob-tab" data-tab="oferta" onclick="abrirAba('oferta')"><span>✏️</span>Oferta</button>
  <button class="mob-tab" data-tab="lista" onclick="abrirAba('lista')"><span>📋</span>Lista</button>
  <button class="mob-tab" data-tab="design" onclick="abrirAba('design')"><span>🎨</span>Design</button>
</nav>

<div class="print-only" style="display:none"><div class="a4-print g1" id="a4-print"></div></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>🖼️ Adicionar Produto <button class="modal-close" onclick="fecharModal()">✕</button></h3>
    <div class="campo"><label>Nome</label><input type="text" id="m-nome" maxlength="50"></div>
    <label class="upload-box" for="m-file"><input type="file" id="m-file" accept="image/*" onchange="uploadProdFile(event)"><span>📁 Tirar foto / Enviar imagem</span></label>
    <img id="m-prev" style="width:90px;height:80px;object-fit:contain;border:2px solid var(--borda);border-radius:6px;display:none;margin:10px auto">
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <input type="checkbox" id="m-rmbg" checked style="width:18px;height:18px">
      <label for="m-rmbg" style="font-size:12px">Remover fundo branco</label>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-outline btn-block" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-azul btn-block" onclick="addProduto()">✓ Adicionar</button>
    </div>
  </div>
</div>

<script>
const LS_GAL='of4_gal',LS_OF='of4_ofertas',LS_LAYOUT='of4_layout';
let galeria=JSON.parse(localStorage.getItem(LS_GAL)||'[]');
let ofertas=JSON.parse(localStorage.getItem(LS_OF)||'[]');
let layout=JSON.parse(localStorage.getItem(LS_LAYOUT)||'null')||{fmt:1,slots:{},cor:'#D00000',corTxt:'#ffffff',logoImg:null,logoTxt:'SUA LOGO'};
let produtoAtual=null,editandoId=null,slotSelecionado=null,modalFileData=null;
const isMobile=()=>window.matchMedia('(max-width:840px)').matches;

const FORMATOS=[
  {id:1,label:'1 Produto',sub:'Folha inteira',celulas:1,grid:'g1'},
  {id:2,label:'2 Produtos',sub:'Meia folha',celulas:2,grid:'g2'},
  {id:4,label:'4 Produtos',sub:'Quadrantes',celulas:4,grid:'g4'},
  {id:6,label:'6 Produtos',sub:'3×2 Mini',celulas:6,grid:'g6'},
];

function renderFormatos(){
  document.getElementById('fmt-list').innerHTML=FORMATOS.map(f=>{
    const cells='<div></div>'.repeat(f.celulas);
    const cols=f.id===1||f.id===2?'1fr':'1fr 1fr';
    const rows=f.id===1?'1fr':(f.id===2?'1fr 1fr':(f.id===4?'1fr 1fr':'1fr 1fr 1fr'));
    return `<div class="fmt-btn ${layout.fmt===f.id?'sel':''}" onclick="setFmt(${f.id})">
      <div class="fmt-icon" style="grid-template:${rows}/${cols}">${cells}</div>
      <div class="fmt-lbl">${f.label}</div>
      <div class="fmt-sub">${f.sub}</div>
    </div>`;
  }).join('');
  const cur=FORMATOS.find(f=>f.id===layout.fmt);
  document.getElementById('fmt-desc').textContent=cur.id===1?'Formato rico: logo, produto grande, preço.':'Formato compacto: só nome e preço (recortar).';
  document.getElementById('info-fmt').textContent=cur.label;
  const sl=document.getElementById('sec-logo'); if(sl) sl.style.display=cur.id===1?'block':'none';
}
function setFmt(id){layout.fmt=id; salvarLayout(); renderFormatos(); render();}
function salvarLayout(){localStorage.setItem(LS_LAYOUT,JSON.stringify(layout));}

function renderGaleria(){
  document.getElementById('gal-count').textContent=galeria.length;
  const el=document.getElementById('galeria');
  if(!galeria.length){el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:18px;color:var(--cinza);font-size:11px">Nenhum produto</div>'; return;}
  el.innerHTML=galeria.map(p=>`
    <div class="gal-item ${produtoAtual&&produtoAtual.id===p.id?'sel':''}" onclick="escolherProduto('${p.id}')">
      <img src="${p.url}">
      <div class="gal-nome">${p.nome}</div>
      <button class="gal-del" onclick="event.stopPropagation();delProd('${p.id}')">✕</button>
    </div>`).join('');
}
function escolherProduto(id){produtoAtual=galeria.find(p=>p.id===id); if(!produtoAtual) return; document.getElementById('f-nome').value=produtoAtual.nome.toUpperCase(); renderGaleria(); if(isMobile()) abrirAba('oferta');}
function delProd(id){if(!confirm('Remover?')) return; galeria=galeria.filter(p=>p.id!==id); localStorage.setItem(LS_GAL,JSON.stringify(galeria)); renderGaleria();}

function abrirModal(){document.getElementById('modal').classList.add('open'); document.getElementById('m-nome').value=''; document.getElementById('m-prev').style.display='none'; modalFileData=null;}
function fecharModal(){document.getElementById('modal').classList.remove('open');}
function uploadProdFile(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{modalFileData=e.target.result; const p=document.getElementById('m-prev'); p.src=modalFileData; p.style.display='block'; if(!document.getElementById('m-nome').value) document.getElementById('m-nome').value=f.name.replace(/\.[^.]+$/,'');};
  r.readAsDataURL(f);
}
function removerFundoAsync(src,tol=240,soft=12){
  return new Promise((res,rej)=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
      const d=ctx.getImageData(0,0,c.width,c.height), px=d.data, ts=Math.max(1,tol-soft);
      for(let i=0;i<px.length;i+=4){
        const m=Math.min(px[i],px[i+1],px[i+2]);
        if(m>=tol) px[i+3]=0;
        else if(m>=ts){const r=(m-ts)/(tol-ts); px[i+3]=Math.round(px[i+3]*(1-r));}
      }
      ctx.putImageData(d,0,0); res(c.toDataURL('image/png'));
    };
    img.onerror=rej; img.src=src;
  });
}
async function addProduto(){
  const nome=document.getElementById('m-nome').value.trim();
  if(!nome||!modalFileData){alert('Nome e imagem obrigatórios'); return;}
  let url=modalFileData;
  if(document.getElementById('m-rmbg').checked){try{url=await removerFundoAsync(url);}catch(e){}}
  const p={id:'p'+Date.now(),nome,url};
  galeria.unshift(p);
  localStorage.setItem(LS_GAL,JSON.stringify(galeria));
  fecharModal(); renderGaleria(); escolherProduto(p.id);
}

function uploadLogo(ev){const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{layout.logoImg=e.target.result; salvarLayout(); render();}; r.readAsDataURL(f);}

function salvarOferta(){
  const o={id:editandoId||'o'+Date.now(),nome:document.getElementById('f-nome').value,preco:parseFloat(document.getElementById('f-preco').value||'0'),un:document.getElementById('f-un').value,produto:produtoAtual};
  if(editandoId) ofertas=ofertas.map(x=>x.id===editandoId?o:x); else ofertas.unshift(o);
  localStorage.setItem(LS_OF,JSON.stringify(ofertas));
  editandoId=null; document.getElementById('edit-badge').style.display='none';
  if(slotSelecionado!==null){layout.slots[slotSelecionado]=o.id; slotSelecionado=null; salvarLayout();}
  renderOfertas(); render();
  if(isMobile()) abrirAba('lista');
}
function renderOfertas(){
  document.getElementById('of-count').textContent=ofertas.length;
  const el=document.getElementById('of-lista');
  if(!ofertas.length){el.innerHTML='<div style="text-align:center;padding:16px;color:var(--cinza);font-size:11px">Nenhuma oferta</div>'; return;}
  const assigned=new Set(Object.values(layout.slots));
  el.innerHTML=ofertas.map(o=>{
    const slot=Object.entries(layout.slots).find(([k,v])=>v===o.id);
    return `<div class="of-card ${assigned.has(o.id)?'assigned':''}" onclick="clicarOferta('${o.id}')">
      <img src="${o.produto?o.produto.url:''}">
      <div class="of-info"><div class="of-nome">${o.nome}</div><div class="of-preco">R$ ${o.preco.toFixed(2)} / ${o.un}</div></div>
      ${slot?`<span class="of-slot">#${+slot[0]+1}</span>`:''}
      <button class="btn btn-sm" style="background:#fee;color:#c00" onclick="event.stopPropagation();delOferta('${o.id}')">✕</button>
    </div>`;
  }).join('');
}
function clicarOferta(id){
  const o=ofertas.find(x=>x.id===id); if(!o) return;
  if(slotSelecionado!==null){layout.slots[slotSelecionado]=id; slotSelecionado=null; salvarLayout(); renderOfertas(); render(); return;}
  editandoId=id;
  document.getElementById('f-nome').value=o.nome;
  document.getElementById('f-preco').value=o.preco;
  document.getElementById('f-un').value=o.un;
  if(o.produto){produtoAtual=o.produto; renderGaleria();}
  document.getElementById('edit-badge').style.display='inline-block';
  if(isMobile()) abrirAba('oferta');
}
function delOferta(id){
  if(!confirm('Remover?')) return;
  ofertas=ofertas.filter(x=>x.id!==id);
  Object.keys(layout.slots).forEach(k=>{if(layout.slots[k]===id) delete layout.slots[k];});
  localStorage.setItem(LS_OF,JSON.stringify(ofertas));
  salvarLayout(); renderOfertas(); render();
}

function render(){
  layout.cor=document.getElementById('cor-faixa').value;
  layout.corTxt=document.getElementById('cor-txt').value;
  layout.logoTxt=document.getElementById('logo-txt').value||'SUA LOGO';
  salvarLayout();
  const fmt=FORMATOS.find(f=>f.id===layout.fmt);
  const a4=document.getElementById('a4');
  a4.className='a4 '+fmt.grid;
  a4.innerHTML=fmt.id===1?htmlRico(ofertas.find(o=>o.id===layout.slots[0])):htmlGrade(fmt.celulas);
  requestAnimationFrame(()=>escalarCelulas(a4));
}
function htmlRico(o){
  const cor=layout.cor, ct=layout.corTxt;
  const nome=(o?o.nome:'SEU PRODUTO').toUpperCase();
  const preco=(o?o.preco:0).toFixed(2).split('.');
  const un=o?o.un:'CADA';
  const prod=o&&o.produto?`<img src="${o.produto.url}">`:'<div style="color:#bbb;font-family:Barlow Condensed,sans-serif;font-size:14px;text-align:center">Toque e atribua<br>uma oferta</div>';
  const logo=layout.logoImg?`<img src="${layout.logoImg}">`:`<span>${layout.logoTxt}</span>`;
  return `
    <div class="enc-logo-box" style="font-size:clamp(10px,2.8vw,18px)">${logo}</div>
    <div class="enc-prod-box ${slotSelecionado===0?'sel':''}" onclick="selecionarSlot(0)">${prod}</div>
    <div class="enc-faixa" style="background:${cor};color:${ct}">
      <div class="enc-fn"><div class="enc-fn-nome" style="font-size:clamp(14px,5vw,36px);color:${ct}">${nome}</div></div>
      <div class="enc-fp" style="color:${ct}">
        <span class="enc-rs" style="font-size:clamp(8px,2.2vw,18px);color:${ct}">R$</span>
        <span class="enc-val" style="font-size:clamp(30px,12vw,90px);color:${ct}">${preco[0]}</span>
        <div class="enc-dir">
          <span class="enc-cent" style="font-size:clamp(12px,4vw,32px);color:${ct}">,${preco[1]}</span>
          <span class="enc-un" style="font-size:clamp(7px,1.8vw,14px);color:${ct}">${un}</span>
        </div>
      </div>
    </div>`;
}
function htmlGrade(n){let o=''; for(let i=0;i<n;i++){const id=layout.slots[i]; const of=id?ofertas.find(x=>x.id===id):null; o+=celula(i,of);} return o;}
function celula(i,o){
  const cor=layout.cor, ct=layout.corTxt;
  const sel=slotSelecionado===i?'sel':'';
  if(!o) return `<div class="cel empty ${sel}" onclick="selecionarSlot(${i})"></div>`;
  const [r,c]=o.preco.toFixed(2).split('.');
  return `<div class="cel ${sel}" onclick="selecionarSlot(${i})">
    <div class="cel-img">${o.produto?`<img src="${o.produto.url}">`:''}</div>
    <div class="cel-faixa" style="background:${cor};color:${ct}">
      <div class="cel-nome" style="color:${ct}">${o.nome.toUpperCase()}</div>
      <div class="cel-preco" style="color:${ct}">
        <span class="cel-rs" style="color:${ct}">R$</span>
        <span class="cel-val">${r}</span>
        <span class="cel-cent">,${c}</span>
      </div>
    </div>
  </div>`;
}
function escalarCelulas(root){
  root.querySelectorAll('.cel:not(.empty)').forEach(cel=>{
    const h=cel.getBoundingClientRect().height; if(!h) return;
    const n=cel.querySelector('.cel-nome'), rs=cel.querySelector('.cel-rs'), v=cel.querySelector('.cel-val'), c=cel.querySelector('.cel-cent');
    if(n) n.style.fontSize=(h*0.10)+'px';
    if(rs) rs.style.fontSize=(h*0.07)+'px';
    if(v) v.style.fontSize=(h*0.22)+'px';
    if(c) c.style.fontSize=(h*0.10)+'px';
  });
}

function selecionarSlot(i){
  slotSelecionado=i; render();
  if(isMobile()) abrirAba('lista');
}

// ═══ ADAPTAÇÃO: MESMO PAINEL, 2 MODOS ═══
function abrirAba(sec){
  // só faz sentido no mobile — mostra só a seção ativa
  document.querySelectorAll('.secao').forEach(s=>s.classList.toggle('active',s.dataset.sec===sec));
  document.querySelectorAll('.mob-tab').forEach(t=>t.classList.toggle('sel',t.dataset.tab===sec));
  document.getElementById('painel').classList.add('open');
  document.getElementById('painel').scrollTop=0;
}
function fecharPainel(){document.getElementById('painel').classList.remove('open');}

// toggle painel via toque no preview (mobile)
document.querySelector('.preview').addEventListener('click',e=>{
  if(!isMobile()) return;
  const painel=document.getElementById('painel');
  if(painel.classList.contains('open') && !e.target.closest('.a4') && !e.target.closest('.p-tools')){
    fecharPainel();
  }
});

function imprimir(){
  const src=document.getElementById('a4');
  const dst=document.getElementById('a4-print');
  const fmt=FORMATOS.find(f=>f.id===layout.fmt);
  dst.className='a4-print '+fmt.grid;
  dst.innerHTML=src.innerHTML;
  const A4H=297*96/25.4;
  const r=src.getBoundingClientRect();
  const k=A4H/r.height;
  const esc=(el)=>{if(el.style){const fs=el.style.fontSize; if(fs&&fs.endsWith('px')) el.style.fontSize=(parseFloat(fs)*k)+'px';} [...(el.children||[])].forEach(esc);};
  esc(dst);
  if(fmt.id===1){
    [['.enc-fn-nome',36],['.enc-val',90],['.enc-cent',32],['.enc-rs',18],['.enc-un',14],['.enc-logo-box span',28]].forEach(([s,p])=>{const e=dst.querySelector(s); if(e) e.style.fontSize=(p*k*(r.width/480))+'px';});
  }
  window.print();
}

function init(){
  document.getElementById('cor-faixa').value=layout.cor;
  document.getElementById('cor-txt').value=layout.corTxt;
  document.getElementById('logo-txt').value=layout.logoTxt;
  ['cor-faixa','cor-txt','logo-txt'].forEach(id=>document.getElementById(id).addEventListener('input',render));
  renderFormatos(); renderGaleria(); renderOfertas(); render();
  window.addEventListener('resize',()=>{escalarCelulas(document.getElementById('a4'));});
}
init();
</script>
</body>
</html>
